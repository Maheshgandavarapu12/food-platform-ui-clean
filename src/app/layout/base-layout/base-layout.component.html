<div class="flex h-screen bg-gray-100">
  <!-- Sidebar -->
  <aside 
    class="bg-gradient-to-b from-indigo-700 to-indigo-900 text-white transition-all duration-300 overflow-hidden"
    [class.w-64]="isSidebarOpen"
    [class.w-20]="!isSidebarOpen"
  >
    <!-- Logo Section -->
    <div class="flex items-center justify-between p-4 border-b border-indigo-600">
      <div *ngIf="isSidebarOpen" class="text-lg font-bold">FoodHub</div>
      <button
        (click)="toggleSidebar()"
        class="p-1 rounded hover:bg-indigo-600 transition"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Navigation Menu -->
    <nav class="mt-4 space-y-2 px-2">
      <a href="#" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-600 transition">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2.323-2.323m0 0a9 9 0 0115.354 0m-11.707 11.707a9 9 0 0115.354-15.354m-11.707-2.646a9.003 9.003 0 0112.728 0"/>
        </svg>
        <span *ngIf="isSidebarOpen" class="text-sm font-medium">Dashboard</span>
      </a>

      <a href="#" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-600 transition">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span *ngIf="isSidebarOpen" class="text-sm font-medium">Orders</span>
      </a>

      <a href="#" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-600 transition">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
        </svg>
        <span *ngIf="isSidebarOpen" class="text-sm font-medium">Messages</span>
      </a>

      <a href="#" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-600 transition">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span *ngIf="isSidebarOpen" class="text-sm font-medium">Wallet</span>
      </a>

      <a href="#" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-600 transition">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
        </svg>
        <span *ngIf="isSidebarOpen" class="text-sm font-medium">Reviews</span>
      </a>

      <a href="#" class="flex items-center space-x-3 p-3 rounded-lg hover:bg-indigo-600 transition">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span *ngIf="isSidebarOpen" class="text-sm font-medium">Settings</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top Navigation Bar -->
    <header class="bg-white shadow h-16 flex items-center justify-between px-6 border-b border-gray-200">
      <h1 class="text-xl font-semibold text-gray-800">Dashboard</h1>

      <div class="flex items-center space-x-6">
        <!-- Notifications -->
        <button class="relative p-2 text-gray-600 hover:text-gray-900 transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span class="absolute top-1 right-1 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/2 -translate-y-1/2 bg-red-600 rounded-full">
            3
          </span>
        </button>

        <!-- Profile Menu -->
        <div class="relative">
          <button
            (click)="toggleProfileMenu()"
            class="flex items-center space-x-3 p-2 rounded-lg hover:bg-gray-100 transition"
          >
            <div class="w-10 h-10 bg-gradient-to-br from-indigo-400 to-indigo-600 rounded-full flex items-center justify-center">
              <span class="text-white font-bold text-sm">{{ getUserInitials() }}</span>
            </div>
            <div *ngIf="currentUser" class="text-left hidden sm:block">
              <p class="text-sm font-semibold text-gray-900">{{ getUserDisplayName() }}</p>
              <p class="text-xs text-gray-500">{{ currentUser.email }}</p>
            </div>
          </button>

          <!-- Profile Dropdown -->
          <div
            *ngIf="isProfileMenuOpen"
            class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl z-50 border border-gray-200"
          >
            <div class="px-4 py-3 border-b border-gray-200">
              <p class="text-sm font-semibold text-gray-900">{{ getUserDisplayName() }}</p>
              <p class="text-xs text-gray-500">{{ currentUser?.email }}</p>
            </div>

            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition">
              Profile
            </a>
            <a href="#" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 transition">
              Settings
            </a>
            <div class="border-t border-gray-200">
              <button
                (click)="logout()"
                class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition"
              >
                Logout
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
