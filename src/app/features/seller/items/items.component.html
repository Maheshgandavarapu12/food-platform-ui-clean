<div class="tableContainer bg-white">
  <div class="header text-right p-2 mr-[15px]">
    <button matButton="filled" class="btn-primary" (click)="createItem()">Create Item</button>
  </div>

  <app-tabel [columns]="columns" [data]="data" [actionTemplate]="actionTpl">
  </app-tabel>

  <ng-template #actionTpl let-row>
    <div>
      <mat-icon color="primary" matTooltip="Edit" (click)="editItem(row)">edit</mat-icon>
      <mat-icon color="warn" matTooltip="Delete" (click)="deleteItem(row.id)">delete</mat-icon>
    </div>
  </ng-template>
