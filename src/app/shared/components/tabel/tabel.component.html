<table mat-table [dataSource]="dataSource" matSort [ngClass]="{ 'mat-elevation-z8': isNoShadow }">

    @for (column of columns; track $index) {
    <ng-container [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
            {{ column.label }}
        </th>
        <td mat-cell *matCellDef="let element">
            @if (column.key === 'actions') {
            <ng-container *ngTemplateOutlet="actionTemplate; context: { $implicit: element }">
            </ng-container>
            } @else {
            {{ element[column.key] }}
            }
        </td>
    </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols;"></tr>

    <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell text-center p-2" [attr.colspan]="cols.length">
            {{ isLoading ? 'Loading...' : 'No data available' }}
        </td>
    </tr>

</table>
<mat-paginator *ngIf="showPaginator" [length]="100" [pageSize]="10" [pageSizeOptions]="[1, 2,3]" aria-label="Select page" class="noFocus">
</mat-paginator>
